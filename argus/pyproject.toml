[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-kernels"
version = "0.1.0"
description = "Verification, attribution and population search around an agentic GPU-kernel loop"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "RSI-Kernel-Tune contributors" }]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
figures = ["matplotlib>=3.6"]
dev = ["pytest>=7"]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argus = ["../configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
