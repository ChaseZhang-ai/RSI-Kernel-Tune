# --- WP15: SPRT early stop (default ON for the local delivery) ---------------
# [loop] sprt_early_stop (card layer, operators/<op>/loop.toml): the card's
# timing module may stop taking device windows once the accumulated paired
# readings' interval sits entirely below parity (a clear loss) — the
# WP11 loss-only rule, hardened by WP15's backtest (scripts/backtest_early_stop.py,
# OVERALL PASS at 4000 paired trials/cell, re-run against PRODUCTION judgment
# per the 107 ruling): the loss stop decides on the clamped band
# [0.005, 0.015] (the unclamped form was a shadowed dead definition and is
# gone; the family cell's clamp cost, worst win-lost 1.35%, stays inside the
# 2% gate), a loss stop must persist across two candidate protocols, and a
# multi-workload job pools its workloads' decided pairs behind a 3-window
# stop floor.
#
# Since WP15 the DEFAULT on the local delivery is ON (the backtest printout is
# the flip record). Set sprt_early_stop = false on a card to restore the old
# default. An SSH delivery keeps the conservative default (the env does not
# cross the wire): arming it there requires RKT_SPRT_EARLY_STOP = "1" in the
# tree's submit.toml [env] — the driver WARNs at startup when the config arms
# the flag but [env] does not declare it (jobs would run full sampling while
# the run log claims early stop).
#
# [loop] sprt_win_stop (default false everywhere): the WIN-direction stop. Only
# safe under the C14 coupling — a win-stopped reading is a truncated draw that
# must pass the driver's watermark confirmation before it enters the
# watermark, the plateau window or lever pricing. Arming it exports
# RKT_SPRT_WIN_STOP / RKT_SPRT_WIN_MARGIN into local job environments.
#
# [loop] confirm_job_mode (default "all"): the gpu_entry mode confirmation
# jobs submit. A card whose eval entry provides a cheaper gate-only mode
# (correctness short-circuit + gate-window timing, the 3-5x confirmation
# discount) sets it here; the stock card template maps perf|all to --mode all,
# so a custom mode needs the eval side to know it (see CHANGES-WP15).
# --- WP17: screening primitive + M0 fidelity (contract C9) --------------------
# This file's tables stay closed-vocabulary; the WP17 keys live on the card layer
# (operators/<op>/loop.toml, read free-form by driver._wp17_apply_cfg — the WP5
# pattern, no cli forwarding). Four keys:
#   [loop] arch_probe_floor_sort        = true   # the analytic-floor PRE-RANK of
#                                                # ARCH_PROBE candidates (a recipe
#                                                # declaring a `problem` view gets
#                                                # floor-ranked; advisory only — a
#                                                # sort suggestion, never a price,
#                                                # never a verdict; red line ①)
#   [loop] arch_probe_near_diff_reprobe = true   # a within-floor pair is re-measured
#                                                # ONCE when the probe budget still
#                                                # has the job (task 3; default config
#                                                # 2x2 has no spare job — inert)
#   [loop] arch_probe_ledger            = true   # readings land in
#                                                # <evidence>/arch_probe_ledger.jsonl
#                                                # (the (family, arch) cache WP19/WP16
#                                                # consume; bookkeeping, never a gate)
#   [loop] cert_every_meta_steps        = 0      # every N-th meta step reserves ONE
#                                                # probe round for the CANDIDATES
#                                                # queue-head certification (task 5;
#                                                # 0 = off — the historical behavior)
# Job-side kill switches (env, read by the seeded tools): RKT_SCREENING_INPROC=0
# puts every screening bench back on the per-call subprocess (the historical
# path); RKT_SCREENING_CLOCK_GUARD=1 turns on the opt-in gpu_state clock guard.
# --- WP16 ----------------------------------------------------------------
# Active search & population governance. This global file's table vocabulary
# stays closed (rsi_kernel_tune.task._KEYS) — the WP16 keys are read from the CARD
# layer's [loop] table (free-form, driver._wp16_apply_cfg, the WP5 shape):
#   [loop] pattern_search_budget  = 2   # driver-run shrink-grid searches per run
#                                       # at a STAGNATION / phase-exhaustion
#                                       # trigger (0 disables the channel)
#   [loop] pattern_search_stages  = 3   # contraction stages per search (1..3)
#   [loop] pool_age_trigger       = 2   # combo-pool meta steps before a forced
#                                       # all-on bundle pricing (0 = off; the
#                                       # plateau path does not depend on it)
#   [loop] reprice_climb_streak   = 2   # consecutive 1-3% KEEP gains that stand
#                                       # the re-price gain gate down for one
#                                       # new-best step (0 = off)
#   [loop] runner_up_pool_k       = 3   # KEEP trees kept in notes/runner_up.jsonl
#                                       # (rank 1 = the best; a restart target
#                                       # needs a rank 2)
# All five default as shown; an explicit value on the card wins.
# --- WP14: shape-regime decision channel --------------------------------------
# This file's tables stay closed-vocabulary ([loop] keys live on the card layer,
# operators/<op>/loop.toml — the WP8 precedent). The WP14 key is read there:
#   [loop] regime_ncu_max        = 2       # per-regime NCU evidence cap: new scoped
#                                          # pricing jobs per meta step, one workload
#                                          # per milestone `regime:` predicate (0 = off;
#                                          # meta steps only, never the eval path)
# Runs whose milestone carries no `regime:` lines buy nothing and render nothing
# (byte-identical to the pre-WP14 loop).
# --- WP18: knowledge closure & beyond-reference supply -----------------------
# Like every [loop] key, these live on the card layer (operators/<op>/loop.toml,
# read free-form; contract C17: WP18 keys resolve through the driver's
# _wp18_apply_cfg and never grow this file's closed vocabulary). Defaults in
# the driver:
#   [loop] kb_cert_batch_size  = 4    # candidates one scheduled certification
#                                     # job may carry (1 = one candidate per
#                                     # job, the per-candidate path; 0 = off)
#   [loop] kb_cert_every_meta  = 2    # the schedule: one verdict-probe round of
#                                     # every N meta steps goes to the candidate
#                                     # queue's head (budget stays
#                                     # [loop] max_verdict_probe_rounds; 0 = never)
# Always-on bookkeeping these keys ride with: the student's kb_used citations
# land in evidence/kb_usage.jsonl (per-entry KEEP/REVERT), KB-MENU renders
# telemetry to evidence/kbmenu_hits.jsonl (aggregated at harvest), null/noop
# levers stamp PRICED_NULL onto the milestone lines citing them, and each
# pricing job banks a lever x workload row in evidence/lever_shape_matrix.json.
# --- WP20: measure-side defense accounting ------------------------------------
# Read on the CARD layer ([loop] in operators/<op>/loop.toml, driver
# _wp20_apply_cfg; the same closed-vocabulary rule as WP12/WP8 above). All three
# are accounting or re-measurement switches — zero gate semantics:
#   [loop] gate_degraded_ratio = 0.5   # unavailable precision rows beyond this share
#                                      # of the block's rows mark the eval
#                                      # `gate_degraded` (the gate went quietly blind)
#   [loop] judge_edge_recheck  = true  # the first correctness FAIL whose
#                                      # corr_margin_ratio sits in (0.9, 1.1) buys one
#                                      # fresh-draw re-eval, judged by the unchanged
#                                      # protocol; false restores the bare judgment
#   [loop] board_span_guard    = true  # the paired reference's own mirror spread
#                                      # beyond 2x the kernel's marks the row
#                                      # board_span_unstable (report-only; the name
#                                      # is the WP23 seam's grep anchor)
# The eval-side sentinels (stream span / timer identity / thread-and-child census,
# eval/benchkit.py; attack fixtures under tests/redteam/ only — contract C16) need
# no configuration: they are always on, and any env failure degrades to `unknown`
# without convicting.
