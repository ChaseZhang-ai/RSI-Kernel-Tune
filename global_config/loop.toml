# --- WP15: SPRT early stop (default ON for the local delivery) ---------------
# [loop] sprt_early_stop (card layer, operators/<op>/loop.toml): the card's
# timing module may stop taking device windows once the accumulated paired
# readings' interval sits entirely below parity (a clear loss) — the
# WP11 loss-only rule, hardened by WP15's backtest (scripts/backtest_early_stop.py,
# OVERALL PASS at 4000 paired trials/cell, re-run against PRODUCTION judgment
# per the 107 ruling): the loss stop decides on the clamped band
# [0.005, 0.015] (the unclamped form was a shadowed dead definition and is
# gone; the family cell's clamp cost, worst win-lost 1.35%, stays inside the
# 2% gate), a loss stop must persist across two candidate protocols, and a
# multi-workload job pools its workloads' decided pairs behind a 3-window
# stop floor.
#
# Since WP15 the DEFAULT on the local delivery is ON (the backtest printout is
# the flip record). Set sprt_early_stop = false on a card to restore the old
# default. An SSH delivery keeps the conservative default (the env does not
# cross the wire): arming it there requires FK_SPRT_EARLY_STOP = "1" in the
# tree's submit.toml [env] — the driver WARNs at startup when the config arms
# the flag but [env] does not declare it (jobs would run full sampling while
# the run log claims early stop).
#
# [loop] sprt_win_stop (default false everywhere): the WIN-direction stop. Only
# safe under the C14 coupling — a win-stopped reading is a truncated draw that
# must pass the driver's watermark confirmation before it enters the
# watermark, the plateau window or lever pricing. Arming it exports
# FK_SPRT_WIN_STOP / FK_SPRT_WIN_MARGIN into local job environments.
#
# [loop] confirm_job_mode (default "all"): the gpu_entry mode confirmation
# jobs submit. A card whose eval entry provides a cheaper gate-only mode
# (correctness short-circuit + gate-window timing, the 3-5x confirmation
# discount) sets it here; the stock card template maps perf|all to --mode all,
# so a custom mode needs the eval side to know it (see CHANGES-WP15).
# --- WP17: screening primitive + M0 fidelity (contract C9) --------------------
# This file's tables stay closed-vocabulary; the WP17 keys live on the card layer
# (operators/<op>/loop.toml, read free-form by driver._wp17_apply_cfg — the WP5
# pattern, no cli forwarding). Four keys:
#   [loop] arch_probe_floor_sort        = true   # the analytic-floor PRE-RANK of
#                                                # ARCH_PROBE candidates (a recipe
#                                                # declaring a `problem` view gets
#                                                # floor-ranked; advisory only — a
#                                                # sort suggestion, never a price,
#                                                # never a verdict; red line ①)
#   [loop] arch_probe_near_diff_reprobe = true   # a within-floor pair is re-measured
#                                                # ONCE when the probe budget still
#                                                # has the job (task 3; default config
#                                                # 2x2 has no spare job — inert)
#   [loop] arch_probe_ledger            = true   # readings land in
#                                                # <evidence>/arch_probe_ledger.jsonl
#                                                # (the (family, arch) cache WP19/WP16
#                                                # consume; bookkeeping, never a gate)
#   [loop] cert_every_meta_steps        = 0      # every N-th meta step reserves ONE
#                                                # probe round for the CANDIDATES
#                                                # queue-head certification (task 5;
#                                                # 0 = off — the historical behavior)
# Job-side kill switches (env, read by the seeded tools): FK_SCREENING_INPROC=0
# puts every screening bench back on the per-call subprocess (the historical
# path); FK_SCREENING_CLOCK_GUARD=1 turns on the opt-in gpu_state clock guard.
