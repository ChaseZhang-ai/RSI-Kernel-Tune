# The bottom layer of every task's [target] and [budget]. task.toml writes only the keys it
# changes; a task that sets [target] ms instead of ratio replaces the ratio below.
[target]
ratio  = 1.2                # x the reference's speed
timing = "device"           # device | e2e

[budget]
hours           = 4         # the loop's wall clock: reconnaissance, distillation and the student's rounds
max_meta        = 3         # teacher rounds that revise the milestone
reference_hours = 8         # writing a reference when the task has none

# --- WP12 ----------------------------------------------------------------
# [loop] kb_menu (default true): the deterministic KB-MENU block (KB-HINTS /
# LEVER-MENU / CALIBRATION; synthesizer src/forgekernel/loop/kbmenu.py —
# contract C7's single implementation) appended to the teacher's diagnose
# prompt after REMOVE_CANDIDATES (contract C3's render order). Retrieval aid
# only: no unmeasured number, no gate reads it.
# The key is set on the CARD layer (operators/<op>/loop.toml), like every
# [loop] key: that file is read free-form (driver._wp5_cfg_sections), while
# this global file's table vocabulary is closed (forgekernel.task._KEYS) and
# WP12 does not grow it. kb_menu = false on a card runs the loop without the
# menu; an absent key leaves it on.

# --- WP8: prior supply (teacher-side) ----------------------------------------
# This file's tables are closed-vocabulary ([loop] keys live on the card layer,
# operators/<op>/loop.toml — the WP1 precedent). The WP8 keys are read there:
#   [loop] teacher_prior_survey   = true    # teacher SOTA survey before recon/distill
#   [loop] teacher_prior_art      = "path"  # offline dossier (task.toml spells it
#                                           # [agent.teacher] prior_art, joined with
#                                           # the task dir)
#   [loop] carry_dir              = "path"  # default tasks/<op>/carry/ (self_evolve)
#   [loop] m0_probe_candidates    = 2       # ARCH_PROBE bracket width (budget stays
#                                           # [loop] m0_probe_rounds)

# --- WP17: screening primitive + M0 fidelity (contract C9) --------------------
# This file's tables stay closed-vocabulary; the WP17 keys live on the card layer
# (operators/<op>/loop.toml, read free-form by driver._wp17_apply_cfg — the WP5
# pattern, no cli forwarding). Four keys:
#   [loop] arch_probe_floor_sort        = true   # the analytic-floor PRE-RANK of
#                                                # ARCH_PROBE candidates (a recipe
#                                                # declaring a `problem` view gets
#                                                # floor-ranked; advisory only — a
#                                                # sort suggestion, never a price,
#                                                # never a verdict; red line ①)
#   [loop] arch_probe_near_diff_reprobe = true   # a within-floor pair is re-measured
#                                                # ONCE when the probe budget still
#                                                # has the job (task 3; default config
#                                                # 2x2 has no spare job — inert)
#   [loop] arch_probe_ledger            = true   # readings land in
#                                                # <evidence>/arch_probe_ledger.jsonl
#                                                # (the (family, arch) cache WP19/WP16
#                                                # consume; bookkeeping, never a gate)
#   [loop] cert_every_meta_steps        = 0      # every N-th meta step reserves ONE
#                                                # probe round for the CANDIDATES
#                                                # queue-head certification (task 5;
#                                                # 0 = off — the historical behavior)
# Job-side kill switches (env, read by the seeded tools): FK_SCREENING_INPROC=0
# puts every screening bench back on the per-call subprocess (the historical
# path); FK_SCREENING_CLOCK_GUARD=1 turns on the opt-in gpu_state clock guard.
