# The bottom layer of every task's [agent]: which CLI runs a turn, which model it asks for,
# where the tokens go (`provider`: `native`, or a name from backends.toml) and how long one
# turn may run. task.toml writes only the keys it changes; [agent.teacher] / [agent.student]
# override one agent, at either layer. Absent `effort` leaves the choice to the CLI.
#
# `backend` names an agent CLI: one module each under src/rsi_kernel_tune/agentbackends/
# (docs/agent-backends.md). The two that ship:
#
#   claude   both roles. The agent policy (offline student, no ssh, no reference reads) is
#            enforced through Claude Code's own settings and hooks.
#   codex    preferred teacher. It serves the teacher role and, on a task whose reference
#            is readable, any role it is allowed to serve. Codex has no such hooks, so the
#            policy is prompt-level rather than refused by the CLI; a sealed-reference
#            task is refused for this backend.
#
# The default is codex-first: teacher uses Codex; student keeps Claude for offline/hook
# enforcement unless the task explicitly overrides it.
#
# [agent.teacher]
# backend = "codex"
# model   = "gpt-5.5-codex"
# effort  = "high"            # -> -c model_reasoning_effort="high"
#
# /goal sessions (a task with no reference, FK_AGENT_DRIVER=goal) are Claude Code only: a
# codex agent on such a task is refused, not silently replaced.
[agent]
backend   = "codex"
provider  = "native"
model     = "gpt-5.5-codex"
timeout_s = 7200            # one student turn is one iteration
# The student may use the network by default: existing kernels are allowed to be looked up
# and reused (a run hands it the local ones in prior/ and lists the rest in prior.md). A
# task that wants a self-contained student sets [agent] online = false. Either way the GPU
# machine is reachable only through the loop's eval commands (ssh and
# `python -m rsi_kernel_tune.submit` stay denied), and the teacher is online as it always was.
online    = true

[agent.teacher]
backend   = "codex"
model     = "gpt-5.5-codex"
effort    = "high"
timeout_s = 14400           # reconnaissance, distillation and diagnosis run for hours

[agent.student]
backend   = "claude"
model     = "claude-opus-5-5"
effort    = "high"
timeout_s = 7200
