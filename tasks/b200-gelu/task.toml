# b200-gelu -- audit set: the exact (erf) GELU activation as one CuTe DSL kernel on the B200
# (sm100). The purest bandwidth-bound elementwise op of the set: one read, one write, a
# transcendental in between -- the audit's baseline for per-element overhead versus the
# straight memory roofline. Everything not written here comes from global_config/.

[task]
language = "cutedsl"
arch     = "sm100"                   # NVIDIA B200

[reference]
run    = "reference/run.py:run"      # the callable timed beside the kernel
source = "reference"                 # the teacher may read it (source mode)

[precision]
compute_dtype = "fp32"               # declared: the erf evaluation in fp32 (docs/compute-dtype.md)

[budget]
hours    = 2
max_meta = 1
