# wp21mini -- the WP21 mini smoke task (test-only; not a member of the formal
# operator set).
# Purpose: energize the machine-mechanism chain on this machine's 3060 (eval/NCU
# jobs, trajectory rows, kbmenu, floor backtest, the wall-clock composition table)
# and produce chain-and-dataflow evidence only, never performance conclusions
# (red line 11).
# Choice: a CUDA C++ elementwise add (float32, n=1M) = the minimal evaluable surface.
# Usage: run_smoke.sh in this directory (a stub-agent stand-in + the loop CLI directly).

[task]
language = "cuda"
arch     = "sm86"

[reference]
run    = "reference/run.py:run"
source = "reference"

[target]
ratio  = 1.2
timing = "device"

[budget]
hours    = 2
max_meta = 1
